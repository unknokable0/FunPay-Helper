<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FP Helper</title>
  <link rel="stylesheet" href="app.css">
  <script defer src="defaults.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
<svg class="svg-defs" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
  <symbol id="i-chat" viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v9a2.5 2.5 0 0 1-2.5 2.5H10l-5 4v-4.4a2.5 2.5 0 0 1-1-2.1z"/><path d="M8 8h8M8 12h6"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24"><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/><circle cx="12" cy="12" r="4"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M14 7l5 5-5 5"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3 20 6v5c0 4.2-2.5 7.4-8 10-5.5-2.6-8-5.8-8-10V6z"/><path d="m9 12 2 2 4-4"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="i-box" viewBox="0 0 24 24"><path d="m4 7 8-4 8 4v10l-8 4-8-4zM4 7l8 4 8-4M12 11v10"/></symbol>
  <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 3 5 13h6l-1 8 9-11h-6z"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20h16M6 17v-5M12 17V5M18 17V9"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></symbol>
</svg>
<div class="app-shell">
  <header class="masthead">
    <div class="identity"><div class="mark" aria-hidden="true">F<span>✦</span></div><div><div class="name-line"><strong>FP Helper</strong><span class="version" id="version"></span></div><p>Помощник продавца на FunPay</p></div></div>
    <div class="privacy"><span class="dot"></span> Данные в вашем браузере</div>
  </header>
  <div class="workspace">
    <aside class="sidebar">
      <div class="sidebar-label">РАБОЧЕЕ ПРОСТРАНСТВО</div>
      <nav aria-label="Разделы расширения">
        <button type="button" class="nav-link" data-view="home"><svg><use href="#i-grid"/></svg><span>Обзор</span></button>
        <button type="button" class="nav-link" data-view="templates"><svg><use href="#i-chat"/></svg><span>Шаблоны</span></button>
        <button type="button" class="nav-link" data-view="lots"><svg><use href="#i-box"/></svg><span>Лоты</span></button>
        <button type="button" class="nav-link" data-view="actions"><svg><use href="#i-bolt"/></svg><span>Быстрые действия</span></button>
        <button type="button" class="nav-link" data-view="stats"><svg><use href="#i-chart"/></svg><span>Статистика</span></button>
        <button type="button" class="nav-link" data-view="settings"><svg><use href="#i-settings"/></svg><span>Настройки</span></button>
      </nav>
      <div class="sidebar-foot"><svg><use href="#i-shield"/></svg><span>Данные хранятся<br>локально</span></div>
    </aside>
    <main id="main" tabindex="-1"></main>
  </div>
  <footer class="footer"><span>FP Helper · для продавцов FunPay</span><a href="https://github.com/unknokable0/FunPay-Helper" target="_blank" rel="noopener noreferrer">GitHub ↗</a></footer>
</div>
<div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
