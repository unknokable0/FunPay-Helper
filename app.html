<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FP Helper</title>
    <link rel="stylesheet" href="app.css" />
    <script defer src="defaults.js"></script>
    <script defer src="app.js"></script>
  </head>
  <body>
    <svg class="svg-defs" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
      <symbol id="i-package-check" viewBox="0 0 24 24">
        <path d="m4 8 8-4 8 4-8 4-8-4Z" />
        <path d="M4 8v9l8 4 8-4V8M12 12v9" />
        <path d="m8.8 15.1 1.8 1.8 4.2-4.4" />
      </symbol>
      <symbol id="i-chat" viewBox="0 0 24 24">
        <path
          d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v9a2.5 2.5 0 0 1-2.5 2.5H10l-5 4v-4.4a2.5 2.5 0 0 1-1-2.1z"
        />
        <path d="M8 8h8M8 12h6" />
      </symbol>
      <symbol id="i-orders" viewBox="0 0 24 24">
        <path d="M6 3.5h12v17l-3-1.7-3 1.7-3-1.7-3 1.7z" />
        <path d="M9 8h6M9 12h6M9 16h4" />
      </symbol>
      <symbol id="i-copy" viewBox="0 0 24 24">
        <rect x="8" y="8" width="12" height="12" rx="2" />
        <path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2" />
      </symbol>
      <symbol id="i-settings" viewBox="0 0 24 24">
        <path
          d="M12 8.2a3.8 3.8 0 1 0 0 7.6 3.8 3.8 0 0 0 0-7.6Z"
        />
        <path
          d="m19.2 13.9 1.1.6-1.5 2.6-1.1-.6a1.8 1.8 0 0 0-2.7 1.5v1.2h-3v-1.2a1.8 1.8 0 0 0-2.7-1.5l-1.1.6-1.5-2.6 1.1-.6a1.8 1.8 0 0 0 0-3.1l-1.1-.6 1.5-2.6 1.1.6a1.8 1.8 0 0 0 2.7-1.5V5.5h3v1.2a1.8 1.8 0 0 0 2.7 1.5l1.1-.6 1.5 2.6-1.1.6a1.8 1.8 0 0 0 0 3.1Z"
        />
      </symbol>
      <symbol id="i-archive" viewBox="0 0 24 24">
        <path d="M4 4h16v4H4zM5 8v12h14V8M9 12h6" />
        <path d="M12 11v5m0 0 2-2m-2 2-2-2" />
      </symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24">
        <path d="M20 7v5h-5M4 17v-5h5" />
        <path d="M5.6 9a7 7 0 0 1 11.8-2L20 9M4 15l2.6 2a7 7 0 0 0 11.8-2" />
      </symbol>
      <symbol id="i-info" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" />
        <path d="M12 11v5m0-9h.01" />
      </symbol>
      <symbol id="i-upload" viewBox="0 0 24 24">
        <path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5" />
        <path d="M5 14v5h14v-5" />
      </symbol>
      <symbol id="i-download" viewBox="0 0 24 24">
        <path d="M12 4v12m0 0 4.5-4.5M12 16l-4.5-4.5" />
        <path d="M5 16v4h14v-4" />
      </symbol>
      <symbol id="i-plus" viewBox="0 0 24 24">
        <path d="M12 5v14M5 12h14" />
      </symbol>
      <symbol id="i-edit" viewBox="0 0 24 24">
        <path
          d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"
        />
      </symbol>
      <symbol id="i-trash" viewBox="0 0 24 24">
        <path d="M3 6h18M8 6V4h8v2m3 0-1 14H6L5 6m4 4v6m6-6v6" />
      </symbol>
      <symbol id="i-shield" viewBox="0 0 24 24">
        <path d="M12 3 20 6v5c0 4.2-2.5 7.4-8 10-5.5-2.6-8-5.8-8-10V6z" />
        <path d="m9 12 2 2 4-4" />
      </symbol>
      <symbol id="i-clock" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" />
        <path d="M12 7v5l3 2" />
      </symbol>
      <symbol id="i-search" viewBox="0 0 24 24">
        <circle cx="10.5" cy="10.5" r="6.5" />
        <path d="m16 16 4 4" />
      </symbol>
      <symbol id="i-external-link" viewBox="0 0 24 24">
        <path d="M14 4h6v6M20 4l-9 9" />
        <path
          d="M18 13v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h5"
        />
      </symbol>
    </svg>
    <div class="app-shell">
      <header class="masthead">
        <div class="identity">
          <div class="mark" aria-hidden="true"><svg><use href="#i-package-check" /></svg></div>
          <div>
            <div class="name-line">
              <strong>FP Helper</strong
              ><span class="version" id="version"></span>
            </div>
            <p>Инструменты для продавцов FunPay</p>
          </div>
        </div>
        <div class="privacy">
          <span class="dot"></span> Шаблоны и настройки хранятся локально
        </div>
      </header>
      <div class="workspace">
        <aside class="sidebar">
          <div class="sidebar-label">РАЗДЕЛЫ</div>
          <nav aria-label="Разделы расширения">
            <button type="button" class="nav-link" data-view="templates">
              <svg><use href="#i-chat" /></svg><span>Шаблоны</span>
            </button>
            <button type="button" class="nav-link" data-view="orders">
              <svg><use href="#i-orders" /></svg><span>Заказы</span>
            </button>
            <button type="button" class="nav-link" data-view="reminders">
              <svg><use href="#i-clock" /></svg><span>Напоминание</span>
            </button>
            <button type="button" class="nav-link" data-view="backup">
              <svg><use href="#i-archive" /></svg><span>Резервная копия</span>
            </button>
            <button type="button" class="nav-link" data-view="updates">
              <svg><use href="#i-refresh" /></svg><span>Обновления</span>
            </button>
            <button type="button" class="nav-link" data-view="settings">
              <svg><use href="#i-settings" /></svg><span>Настройки</span>
            </button>
          </nav>
          <div class="sidebar-foot">
            <svg><use href="#i-shield" /></svg
            ><span>Перевод отправляется Google только по нажатию</span>
          </div>
        </aside>
        <main id="main" tabindex="-1"></main>
      </div>
      <footer class="footer">
        <a
          href="https://github.com/unknokable0/FunPay-Helper"
          target="_blank"
          rel="noopener noreferrer"
          ><svg aria-hidden="true"><use href="#i-external-link" /></svg>GitHub</a
        >
      </footer>
    </div>
    <div id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
