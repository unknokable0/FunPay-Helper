<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <style>
    body { width: 340px; font: 14px system-ui, sans-serif; margin: 12px; }
    textarea { width: 100%; height: 220px; box-sizing: border-box; font: 13px system-ui, sans-serif; }
    button { margin-top: 8px; padding: 6px 14px; cursor: pointer; }
    .hint { color: #666; font-size: 12px; margin: 6px 0; }
    #status { margin-left: 8px; color: #2a7a2a; }
  </style>
</head>
<body>
  <b>Шаблоны сообщений</b>
  <p class="hint">
    Первая строка = название кнопки. Дальше текст.<br>
    Шаблоны разделяй строкой <code>---</code>
  </p>
  <textarea id="editor"></textarea>
  <button id="save">Сохранить</button><span id="status"></span>
  <script src="defaults.js"></script>
  <script src="popup.js"></script>
</body>
</html>
