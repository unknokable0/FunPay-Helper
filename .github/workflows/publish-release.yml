name: Publish extension release

on:
  push:
    branches:
      - main
    paths:
      - manifest.json
      - CHANGELOG.md
      - .github/workflows/publish-release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./manifest.json').version")"
          tag="v${version}"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; nothing to publish."
            exit 0
          fi

          python3 - "$version" > release-notes.md <<'PY'
          from pathlib import Path
          import sys

          version = sys.argv[1]
          lines = Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()
          start = next(
              (i + 1 for i, line in enumerate(lines) if line.startswith(f"## {version} ")),
              None,
          )
          if start is None:
              raise SystemExit(f"No CHANGELOG entry found for {version}")
          end = next(
              (i for i in range(start, len(lines)) if lines[i].startswith("## ")),
              len(lines),
          )
          notes = "\n".join(lines[start:end]).strip()
          if not notes:
              raise SystemExit(f"Empty CHANGELOG entry for {version}")
          print(notes)
          PY

          asset="FunPay-Helper-${tag}.zip"
          git archive --format=zip --prefix=FunPay-Helper/ HEAD -o "$asset"
          gh release create "$tag" "$asset" \
            --title "FunPay Helper ${version}" \
            --notes-file release-notes.md \
            --target "$GITHUB_SHA"